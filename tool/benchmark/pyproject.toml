[project]
name = "echofold-benchmark"
version = "0.1.0"
description = "Echofold 可复现 ASR/重识别基准：manifest、评分、预注册与报告"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
echofold-benchmark = "echofold_benchmark.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
